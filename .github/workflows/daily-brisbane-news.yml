name: Daily Brisbane News Email

on:
  schedule:
    # 09:30 Australia/Brisbane (AEST, UTC+10) = 23:30 UTC previous day
    - cron: '30 23 * * *'
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  send-news-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send daily Brisbane news digest
        env:
          # ── Required ───────────────────────────────────────────────────────────
          EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}     # your Outlook address
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}       # recipient(s), comma-separated
          SMTP_USER:     ${{ secrets.SMTP_USER }}      # Outlook login (= EMAIL_FROM)
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}  # Outlook password / App Password

          # ── Optional (Outlook defaults applied if omitted) ─────────────────────
          # Personal @outlook.com / @hotmail.com / @live.com → smtp-mail.outlook.com
          # Microsoft 365 / work or school accounts          → smtp.office365.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}   # leave secret empty to use default
          SMTP_PORT: ${{ secrets.SMTP_PORT }}   # leave secret empty to use 587
        run: python news_digest.py
